<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #070a10;
    --surface: #0e131c;
    --surface2: #151c28;
    --surface3: #1d2634;
    --text: #e9eefb;
    --muted: #8d9ab3;
    --accent: #4fd1ff;
    --accent2: #8b7cff;
    --danger: #ff6b81;
    --ok: #5be3a5;
    --amber: #f0b45a;
    --radius: 10px;
    --ui-opacity: 1;
    --ui-blur: 0px;
    --ui-font: "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  body.light {
    --bg: #eef2f8;
    --surface: #ffffff;
    --surface2: #eef3fa;
    --surface3: #e4ebf5;
    --text: #1b2436;
    --muted: #65738d;
    --accent: #0e8fce;
    --accent2: #6a5cff;
    --ok: #17925f;
    --amber: #a86a00;
    --danger: #d43a52;
    color-scheme: light;
  }
  /* AMOLED: настоящий чёрный фон, без серых «почти чёрных» поверхностей. */
  body.amoled {
    --bg: #000000;
    --surface: #050505;
    --surface2: #0b0b0b;
    --surface3: #141414;
    --text: #f4f7fb;
    --muted: #8b95a3;
    --ok: #37d99a;
    --amber: #f0b45a;
    --danger: #ff6b81;
    color-scheme: dark;
  }
  body.amoled #backdrop { background: #000; }
  body.amoled #tabbar { border-color: #141414; }
  body.amoled .tab { background: #070707; }
  body.amoled .tab:hover { background: #0e0e0e; }
  body.amoled .tab.active { background: #000; border-color: #1c1c1c; }
  body.amoled #toolbar { border-color: #121212; }
  body.amoled #omni { background: #050505; border-color: #1a1a1a; }
  body.amoled #panel { background: color-mix(in srgb, #050505 calc(var(--ui-opacity) * 100%), transparent); border-color: #1a1a1a; }
  body.amoled .pbtn { background: #0b0b0b; border-color: #1d1d1d; }
  body.amoled .pbtn:hover { background: #151515; border-color: #292929; }
  body.amoled .sform input, body.amoled .sform select { background: #0a0a0a; border-color: #1d1d1d; }
  body.amoled .item:hover { background: #0c0c0c; }
  body.amoled .sep { background: #161616; }
  body.amoled .setsec .item { background: transparent; }

  /* ---------- стиль Chrome (по умолчанию) ---------- */
  body.style-chrome.light {
    --bg: #dee1e6; --surface: #ffffff; --surface2: #f1f3f4; --surface3: #e8eaed;
    --text: #202124; --muted: #5f6368; --accent: #1a73e8; --accent2: #1765cc;
    --ok: #188038; --danger: #d93025; --amber: #b06000;
    color-scheme: light;
  }
  body.style-chrome:not(.light) {
    --bg: #202124; --surface: #292a2d; --surface2: #35363a; --surface3: #3c4043;
    --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; --accent2: #aecbfa;
  }
  body.style-chrome #tabbar { height: 44px; padding: 8px 6px 0 8px; background: var(--bg); border-bottom: 0; }
  body.style-chrome .tab { height: 35px; border-radius: 8px 8px 0 0; background: transparent; border: 0;
                           color: var(--muted); min-width: 140px; }
  body.style-chrome .tab:hover { background: var(--surface2); color: var(--text); }
  body.style-chrome .tab.active { background: var(--surface); color: var(--text); box-shadow: none; border-color: transparent; }
  body.style-chrome .tab.active::after { display: none; }
  body.style-chrome .tab .fav { background: var(--surface3); color: var(--muted); border-radius: 4px; }
  body.style-chrome .tab.active .fav { background: transparent; }
  body.style-chrome #toolbar { height: 48px; padding: 0 6px; background: var(--surface);
                               border-bottom: 1px solid rgba(0,0,0,.12); }
  body.style-chrome:not(.light) #toolbar { border-bottom-color: #3c4043; }
  body.style-chrome .btn { width: 34px; height: 34px; border-radius: 50%; }
  body.style-chrome .btn:hover { background: var(--surface2); }
  body.style-chrome #omni { height: 36px; margin: 0 8px; border-radius: 18px;
                            background: var(--surface2); border: 1px solid transparent; }
  body.style-chrome #omni:focus-within { background: var(--surface); border-color: var(--accent);
                                         box-shadow: 0 1px 6px rgba(32,33,36,.22); }
  body.style-chrome #panel { border-radius: 12px; }
  body.style-chrome .tab.sleep .ttl { font-style: normal !important; }
  body.style-chrome #tablist { flex: 0 1 auto; }
  body.style-chrome #addtab { margin-left: 4px; }
  #bookmarksbar { display: none; height: 32px; align-items: center; gap: 2px; padding: 0 10px;
                  overflow: hidden; background: var(--surface); border-bottom: 1px solid rgba(0,0,0,.06); }
  body.style-chrome:not(.light) #bookmarksbar { border-bottom-color: #3c4043; }
  #bookmarksbar .bm { height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: var(--text);
                      max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bookmarksbar .bm:hover { background: var(--surface2); }
  body.style-chrome #bookmarksbar { position: relative; }
  body.style-chrome #enginebtn { display: none; }
  body.style-chrome #enginebtn,
  body.style-chrome #downloads,
  body.style-chrome #musicbtn,
  body.style-chrome #shield,
  body.style-chrome #aibtn,
  body.style-chrome #star { display: none; }
  .omni-star { display: none; }
  body.style-chrome .omni-star { display: grid; place-items: center; width: 30px; height: 30px;
                                 border-radius: 50%; flex: 0 0 auto; margin-right: 2px; color: var(--muted); }
  body.style-chrome .omni-star:hover { background: var(--surface3); color: var(--text); }
  body.style-chrome .omni-star.on { color: var(--accent); }
  .profilebtn { display: none; }
  body.style-chrome .profilebtn { display: grid; place-items: center; }
  .profilebtn .avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                        background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
                        font-size: 12px; font-weight: 700; }
  body.style-chrome #toolbar { height: 42px; }
  body.style-chrome .btn { width: 32px; height: 32px; }
  body.style-chrome #omni { height: 34px; border-radius: 17px; padding-right: 2px; }
  body.style-chrome #tabbar { height: 40px; padding: 6px 8px 0 8px; }
  body.style-chrome .tab { height: 34px; font-size: 12px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.35 var(--ui-font);
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .row { display: flex; align-items: center; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; }

  #backdrop { position: fixed; inset: 0; z-index: 0; display: none; overflow: hidden;
    background:
      radial-gradient(760px 460px at 82% -8%, rgba(79,209,255,.12), transparent 62%),
      radial-gradient(620px 460px at 8% 108%, rgba(139,124,255,.12), transparent 62%),
      var(--bg); }
  #backdrop::after { content: ""; position: absolute; left: 50%; top: 52%; width: 1080px; height: 380px;
    transform: translate(-50%, -50%) rotate(-16deg); border-radius: 50%;
    border: 1px solid rgba(139,124,255,.22); box-shadow: 0 0 120px rgba(79,209,255,.06) inset; }
  body.haspanel #backdrop { display: block; }
  body.light #backdrop { background: var(--bg); }

  /* ---------- вкладки ---------- */
  #tabbar {
    position: relative; z-index: 2;
    height: 38px; display: flex; align-items: flex-end; gap: 2px;
    padding: 6px 0 0 10px;
    background: color-mix(in srgb, var(--bg) calc(var(--ui-opacity) * 100%), transparent);
    border-bottom: 1px solid #161e2b;
  }
  body.light #tabbar { background: color-mix(in srgb, #eef3fa calc(var(--ui-opacity) * 100%), transparent); border-color: #dbe3ef; }
  #tablist { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
             flex: 1 1 auto; min-width: 0; }
  #tablist::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 7px; min-width: 118px; max-width: 228px;
    height: 31px; padding: 0 8px 0 10px; border-radius: 9px 9px 0 0;
    background: #0d121b; color: var(--muted); cursor: pointer; position: relative;
    border: 1px solid transparent; border-bottom: none; flex: 0 0 auto;
    transition: background .12s ease, color .12s ease;
  }
  body.light .tab { background: #e4ebf5; }
  .tab:hover { background: var(--surface2); color: var(--text); }
  .tab.active { background: var(--surface); color: var(--text); border-color: #1c2637;
                box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  body.light .tab.active { border-color: #d8e1ee; }
  .tab.active::after {
    content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px;
    border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 10px rgba(79,209,255,.35);
  }
  .tab .fav {
    width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 8.5px; font-weight: 700; color: #051018;
  }
  .tab .gdot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
                background: var(--gcolor, #8b7cff); box-shadow: 0 0 0 2px rgba(255,255,255,.06); }
  .tab.grouped::before { content: ""; position: absolute; left: 6px; right: 6px; top: 0; height: 2px;
                         border-radius: 0 0 2px 2px; background: var(--gcolor, #8b7cff); opacity: .9; }
  .tab.pinned .gdot { display: none; }
  .tab.incognito .fav { background: linear-gradient(135deg,#b39dff,#6d4bd8); }
  .tab.active .fav { box-shadow: 0 0 0 2px rgba(79,209,255,.16); }
  .tab .ttl { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .tab .x, .tab .pin { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
            font-size: 11px; opacity: 0; transition: opacity .12s, background .12s; }
  .tab .mute { width: 14px; height: 14px; display: grid; place-items: center; color: var(--danger); flex: 0 0 auto; }
  .tab .mute svg { width: 12px; height: 12px; }
  .tab .x { color: var(--muted); }
  .tab .pin svg { width: 12px; height: 12px; }
  .tab:hover .x, .tab.active .x, .tab:hover .pin, .tab.pinned .pin { opacity: .62; }
  .tab .x:hover, .tab .pin:hover { opacity: 1; background: var(--surface3); }
  .tab.pinned { min-width: 52px; max-width: 52px; padding: 0 6px; justify-content: center; gap: 4px; }
  .tab.pinned .ttl, .tab.pinned .x { display: none; }
  .tab.pinned .pin { opacity: .95; color: var(--accent); }
  .tab.loading .fav { animation: pulse 1s infinite ease-in-out; }
  .tab.sleep { opacity: .68; }
  .tab.sleep .fav { filter: grayscale(.4); }
  .tab.sleep .ttl { font-style: italic; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  #addtab { width: 28px; height: 28px; border-radius: 9px; color: var(--muted); display: grid;
            place-items: center; margin-left: 4px; flex: 0 0 auto; }
  #addtab:hover { background: var(--surface2); color: var(--text); }
  #winctl { display: flex; align-self: flex-start; height: 38px; margin-top: -6px; margin-left: 2px; flex: 0 0 auto; }
  .wbtn { width: 46px; height: 38px; border-radius: 0; display: grid; place-items: center;
          color: var(--muted); flex: 0 0 auto; }
  .wbtn:hover { background: var(--surface2); color: var(--text); }
  .wbtn.close:hover { background: #e81123; color: #fff; }
  .wbtn svg { width: 11px; height: 11px; stroke-width: 1.4; }
  #winmax .rest { display: none; }
  body.maximized #winmax .maxi { display: none; }
  body.maximized #winmax .rest { display: block; }

  /* ---------- панель инструментов ---------- */
  #toolbar { position: relative; z-index: 2;
             height: 54px; display: flex; align-items: center; gap: 4px; padding: 0 10px;
             background: color-mix(in srgb, var(--surface) calc(var(--ui-opacity) * 100%), transparent);
             border-bottom: 1px solid #161e2b;
             -webkit-backdrop-filter: blur(var(--ui-blur)) saturate(140%);
             backdrop-filter: blur(var(--ui-blur)) saturate(140%); }
  body.light #toolbar { border-color: #e0e7f1; }
  .btn { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); position: relative; }
  .btn:hover { background: var(--surface2); color: var(--text); }
  .btn:disabled { opacity: .3; cursor: default; background: none; }
  .btn .dot { position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%;
              background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  #omni {
    flex: 1 1 auto; display: flex; align-items: center; gap: 8px; height: 36px; margin: 0 7px;
    padding: 0 11px; border-radius: 12px; background: #090e16; border: 1px solid #18212f;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  body.light #omni { background: #f5f8fc; border-color: #dbe3ef; }
  #omni:focus-within { border-color: rgba(79,209,255,.55); box-shadow: 0 0 0 3px rgba(79,209,255,.11); }
  #omni .lock { display: grid; place-items: center; flex: 0 0 auto; }
  #omni input {
    flex: 1 1 auto; background: none; border: 0; outline: none; color: var(--text);
    font-size: 13px; min-width: 20px; user-select: text;
  }
  #omni input::placeholder { color: #4b5872; }
  #star.on { color: #ffd15c; }
  #star.on svg { fill: currentColor; }
  #shield { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border-radius: 9px;
            color: var(--ok); font-size: 11.5px; font-weight: 600; }
  #shield:hover { background: var(--surface2); }
  #shield svg { width: 15px; height: 15px; }
  #shield .n { min-width: 8px; font-variant-numeric: tabular-nums; }
  #incogBadge { display: none; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
                border-radius: 999px; font-size: 11px; font-weight: 600; color: #cbb8ff;
                background: rgba(139,124,255,.12); border: 1px solid rgba(139,124,255,.35); }
  #incogBadge.on { display: flex; }
  body.light #incogBadge { color: #5b3fd0; }
  #aibtn { color: var(--accent); }
  #aibtn:hover { background: rgba(79,209,255,.1); }
  #enginebtn { width: 30px; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  #enginebtn:hover { color: var(--text); background: var(--surface2); }

  /* ---------- прогресс ---------- */
  #progress { position: absolute; left: 0; top: 90px; height: 2px; width: 0; opacity: 0; z-index: 3;
              background: linear-gradient(90deg, var(--accent), var(--accent2));
              box-shadow: 0 0 12px rgba(79,209,255,.5);
              transition: width .25s ease, opacity .3s ease; }
  #progress.on { opacity: 1; }

  /* ---------- панели ---------- */
  #panel {
    position: absolute; top: 84px; right: 10px; width: 352px; max-width: calc(100vw - 20px);
    max-height: calc(100vh - 98px);
    overflow: auto; background: color-mix(in srgb, #0b1019 calc(var(--ui-opacity) * 100%), transparent);
    border: 1px solid #1f2a3d; border-radius: 14px;
    box-shadow: 0 24px 64px rgba(0,0,0,.7), 0 0 0 1px rgba(79,209,255,.04) inset;
    -webkit-backdrop-filter: blur(var(--ui-blur)) saturate(140%);
    backdrop-filter: blur(var(--ui-blur)) saturate(140%);
    padding: 6px; z-index: 50; animation: drop .14s ease-out;
    scrollbar-width: thin; scrollbar-color: #2a3548 transparent;
  }
  body.light #panel { background: color-mix(in srgb, #ffffff calc(var(--ui-opacity) * 100%), transparent); border-color: #dfe6f1; box-shadow: 0 24px 64px rgba(20,35,60,.18); }
  #panel.hidden { display: none; }
  @keyframes drop { from { opacity: 0; transform: translateY(-7px) scale(.995) } to { opacity: 1; transform: none } }
  .phead { display: flex; align-items: center; justify-content: space-between; padding: 8px 9px; }
  .phead .t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  .phead .act { font-size: 11px; color: var(--accent); padding: 3px 8px; border-radius: 7px; }
  .phead .act:hover { background: var(--surface2); }
  .sect { padding: 10px 9px 3px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
          color: var(--muted); font-weight: 700; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 9px; border-radius: 10px; cursor: pointer; }
  .item:hover { background: var(--surface2); }
  .item .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--surface3);
              display: grid; place-items: center; color: var(--muted); flex: 0 0 auto; }
  .item .ic svg { width: 15px; height: 15px; }
  .item .body { flex: 1 1 auto; min-width: 0; }
  .item .l1 { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .l2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .del { opacity: 0; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
               color: var(--muted); flex: 0 0 auto; }
  .item:hover .del { opacity: .8; }
  .item .del:hover { background: #3a2130; color: var(--danger); opacity: 1; }
  .sep { height: 1px; background: #18202e; margin: 6px 8px; }
  body.light .sep { background: #e6ecf5; }
  .zoomrow { display: flex; align-items: center; gap: 6px; padding: 2px 7px 8px; }
  .zoomrow .zbtn { width: 30px; height: 28px; border-radius: 8px; background: #090e16; display: grid;
                   place-items: center; color: var(--muted); }
  body.light .zoomrow .zbtn { background: #f5f8fc; }
  .zoomrow .zbtn:hover { background: var(--surface2); color: var(--text); }
  .zoomrow .val { flex: 1; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .about { padding: 8px 11px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.65; }
  .about b { color: var(--text); }
  .about .k { color: var(--accent); }
  .devcard { margin: 6px 9px 10px; padding: 12px 13px; border-radius: 12px;
             background: linear-gradient(160deg, rgba(79,209,255,.055), rgba(139,124,255,.055)), var(--surface2);
             border: 1px solid #1c2637; }
  body.light .devcard { border-color: #dfe7f2; background: #f7faff; }
  .devcard .dtitle { font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
                     background: linear-gradient(90deg, var(--accent), var(--accent2));
                     -webkit-background-clip: text; background-clip: text; color: transparent; }
  .devcard .drow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
                   padding: 3px 0; font-size: 11.5px; }
  .devcard .drole { color: var(--muted); flex: 0 0 auto; }
  .devcard .dname { color: var(--text); text-align: right; }
  .devcard .dcopy { margin-top: 9px; padding-top: 8px; border-top: 1px dashed #253149;
                    color: var(--muted); font-size: 10.5px; line-height: 1.5; }
  body.light .devcard .dcopy { border-color: #dbe4f0; }
  .empty { padding: 16px 12px 20px; color: var(--muted); font-size: 12px; text-align: center; }
  .bigstats { padding: 8px 14px 14px; }
  .bigstats .n { font-size: 38px; font-weight: 200; letter-spacing: -1px; line-height: 1;
                 background: linear-gradient(135deg, #bff0ff, #c9beff); -webkit-background-clip: text;
                 background-clip: text; color: transparent; }
  body.light .bigstats .n { background: none; color: #1b2436; }
  .bigstats .h { margin-top: 7px; color: var(--muted); font-size: 12px; }
  .bigstats .note { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }

  /* ---------- безопасность ---------- */
  #shield { transition: color .15s ease; }
  #shield.sec-alert { color: var(--danger); }
  #shield.sec-warn { color: var(--amber); }
  #shield.sec-off { color: var(--muted); }
  #shield.sec-idle { color: var(--muted); }
  .seccard { margin: 4px 8px 10px; padding: 12px 13px; border-radius: 12px;
             background: linear-gradient(160deg, rgba(79,209,255,.05), rgba(139,124,255,.04)), #0d131d;
             border: 1px solid #1c2637; }
  body.light .seccard { background: #f7faff; border-color: #dfe7f2; }
  .seccard .st { display: flex; align-items: center; gap: 9px; }
  .seccard .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok);
                  box-shadow: 0 0 10px rgba(45,212,149,.7); flex: 0 0 auto; }
  .seccard .dot.amber { background: var(--amber); box-shadow: 0 0 10px rgba(255,190,80,.6); }
  .seccard .dot.red { background: var(--danger); box-shadow: 0 0 10px rgba(255,107,129,.6); }
  .seccard .dot.gray { background: #5b6a86; box-shadow: none; }
  .seccard .big { font-size: 13px; font-weight: 600; }
  .seccard .host { margin-top: 3px; font: 11.5px/1.4 Consolas, monospace; color: var(--muted);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seccard .why { margin-top: 8px; padding: 7px 9px; border-radius: 8px; font-size: 11px; line-height: 1.45;
                  color: #ffb3bf; background: rgba(255,107,129,.08); border: 1px solid rgba(255,107,129,.25); }

  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    const now = new Date();
    const same = d.toDateString() === now.toDateString();
    const pad = (n) => String(n).padStart(2, "0");
    return same ? pad(d.getHours()) + ":" + pad(d.getMinutes())
                : pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDur(sec) {
    sec = Math.max(0, Number(sec) || 0);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h > 0 ? h + " ч " + pad(m) + " мин" : (m > 0 ? m + " мин " + pad(s) + " с" : s + " с");
  }
  function fmtDay(ts) {
    if (!ts) return "никогда";
    const d = new Date(ts * 1000);
    const pad = (n) => String(n).padStart(2, "0");
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear();
  }
  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " ГБ";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " МБ";
    if (n >= 1024) return (n / 1024).toFixed(0) + " КБ";
    return n + " Б";
  }

  function renderBookmarksBar(s) {
    const bb = $("bookmarksbar");
    if (!bb) return;
    const items = s.bookmarks || [];
    const show = s.uiStyle !== "orvyn" && !!s.bookmarksBar && items.length > 0;
    bb.style.display = show ? "flex" : "none";
    if (!show) { bb.innerHTML = ""; return; }
    bb.innerHTML = items.slice(0, 16).map((b) =>
      '<button class="bm" data-bm="' + esc(b.url) + '" title="' + esc(b.url) + '">' + esc(b.title || b.url) + '</button>'
    ).join("");
    bb.querySelectorAll("[data-bm]").forEach((el) => {
      el.onclick = () => ipc({ cmd: "navigate", text: el.getAttribute("data-bm") });
    });
  }

  window.render = function (s) {
    st = s;
    renderTabs();
    renderPanel();
    renderBookmarksBar(s);
    const eb = $("enginebtn");
    if (eb) {
      const e = s.searchEngine || "ddg";
      eb.textContent = e === "google" ? "G" : (e === "own" ? "O" : "D");
      eb.title = "Поиск: " + (e === "google" ? "Google" : (e === "own" ? "ORVYN" : "DuckDuckGo")) + ". Нажми, чтобы сменить. В адресной строке работают !g, !d, !y, !b, !w";
    }

    document.body.classList.toggle("glow", !!s.glow);
    document.body.classList.toggle("noanim", !s.anim);
    document.body.classList.toggle("haspanel", !!s.panel);
    document.body.classList.toggle("light", s.theme === "light");
    document.body.classList.toggle("amoled", s.theme === "amoled");
    document.body.classList.toggle("style-chrome", s.uiStyle !== "orvyn");
    document.body.classList.toggle("maximized", !!s.maximized);
    const b = document.body;
    b.style.setProperty("--accent", s.accent || "#4fd1ff");
    b.style.setProperty("--accent2", s.accent2 || "#8b7cff");
    b.style.setProperty("--radius", (Number(s.uiRadius) || 10) + "px");
    b.style.setProperty("--ui-opacity", String((Number(s.uiOpacity) || 100) / 100));
    b.style.setProperty("--ui-blur", (Number(s.uiBlur) || 0) + "px");
    b.style.setProperty("--ui-font", FONTS[s.uiFont] || FONTS.segoe);
    b.style.fontFamily = FONTS[s.uiFont] || FONTS.segoe;
    b.classList.toggle("toolbar-hidden", !!s.toolbarHidden);
    b.classList.toggle("panel-left", !!s.panelLeft);
    b.classList.toggle("addr-row", !!s.addressRow);
    b.classList.remove("shape-rounded", "shape-pill", "shape-square");
    b.classList.add("shape-" + (s.tabShape || "rounded"));
    b.classList.remove("wall-none", "wall-aurora", "wall-grid", "wall-dots", "wall-paper");
    b.classList.add("wall-" + (s.wallpaper || "none"));

    $("back").disabled = !s.canBack;
    $("fwd").disabled = !s.canForward;
    $("star").classList.toggle("on", !!s.bookmarked);
  if ($("star2")) $("star2").classList.toggle("on", !!s.bookmarked);
    $("blockedn").textContent = s.blocked > 999 ? "999+" : String(s.blocked);
    const sec = s.security || {};
    const sh = $("shield");
    sh.classList.remove("sec-alert", "sec-warn", "sec-off", "sec-idle");
    if (sec.level === "warn") sh.classList.add("sec-alert");
    else if (sec.level === "http") sh.classList.add("sec-warn");
    else if (sec.level === "off" || sec.level === "idle") sh.classList.add("sec-off");
    sh.title = (sec.label || "Безопасность") +
      (s.siteBlocked ? " · на сайте заблокировано " + s.siteBlocked : "") +
      " · всего " + s.blocked;
    $("incogBadge").classList.toggle("on", !!s.incognito);
    $("dldot").style.display = s.dlActive > 0 ? "block" : "none";

    if (!typing) $("url").value = urlText();

  const input = $("url");

  input.addEventListener("blur", () => { typing = false; input.value = urlText(); });
  input.addEventListener("input", () => { typing = true; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const v = input.value.trim();
      typing = false;
      input.blur();
      ipc({ cmd: "navigate", text: v });
    } else if (e.key === "Escape") {
      typing = false;
      input.blur();
      ipc({ cmd: "panel", name: "" });
    }
  });

  function zoom(d) { ipc({ cmd: "zoom", delta: d }); }

  document.addEventListener("keydown", (e) => {
    const k = (e.key || "").toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    if (k === "enter" && !e.shiftKey && e.target && e.target.id === "aiq") {
      e.preventDefault();
      const text = e.target.value || "";
      if (text.trim() && !st.aiBusy) {
        ipc({ cmd: "aiSend", text: text });
        e.target.value = "";
      }
      return;
    }
    if (e.altKey && !ctrl && k === "a") {
      e.preventDefault();
      ipc({ cmd: "panel", name: "ai" });
      return;
    }
    if (ctrl && e.shiftKey && k === "t") { e.preventDefault(); ipc({ cmd: "reopenTab" }); }
    else if (ctrl && e.shiftKey && k === "n") { e.preventDefault(); ipc({ cmd: "newIncognito" }); }
    else if (ctrl && k === "t") { e.preventDefault(); ipc({ cmd: "newTab" }); }
    else if (ctrl && k === "w") { e.preventDefault(); ipc({ cmd: "closeTab", id: currentId() }); }
    else if (ctrl && k === "l") { e.preventDefault(); window.focusBar(); }
    else if (ctrl && k === "r") { e.preventDefault(); ipc({ cmd: "reload" }); }
    else if (ctrl && e.shiftKey && k === "d") { e.preventDefault(); ipc({ cmd: "dupTab", id: currentId() }); }
    else if (ctrl && k === "d") { e.preventDefault(); ipc({ cmd: "bookmark" }); }
    else if (ctrl && k === "f") { e.preventDefault(); ipc({ cmd: "findInPage" }); }
    else if (ctrl && k === "m") { e.preventDefault(); ipc({ cmd: "muteTab", id: currentId() }); }
    else if (ctrl && e.shiftKey && k === "a") { e.preventDefault(); ipc({ cmd: "panel", name: "tabs" }); }
    else if (ctrl && e.shiftKey && k === "b") { e.preventDefault(); ipc({ cmd: "toggle", name: "toolbarHidden" }); }
    else if (ctrl && e.shiftKey && k === "l") { e.preventDefault(); ipc({ cmd: "vaultFillCurrent" }); }
    else if (ctrl && e.shiftKey && k === "i") { e.preventDefault(); ipc({ cmd: "devtools" }); }
    else if (ctrl && k === "tab") { e.preventDefault(); ipc({ cmd: "cycleTab", delta: e.shiftKey ? -1 : 1 }); }
    else if (ctrl && (k === "+" || k === "=")) { e.preventDefault(); zoom(0.1); }
    else if (ctrl && k === "-") { e.preventDefault(); zoom(-0.1); }
    else if (ctrl && k === "0") { e.preventDefault(); zoom(0); }
    else if (k === "f5") { e.preventDefault(); ipc({ cmd: "reload" }); }
    else if (e.altKey && k === "arrowleft") { e.preventDefault(); ipc({ cmd: "back" }); }
    else if (e.altKey && k === "arrowright") { e.preventDefault(); ipc({ cmd: "forward" }); }
    else if (e.altKey && k === "home") { e.preventDefault(); ipc({ cmd: "home" }); }
    else if (k === "escape") { ipc({ cmd: "panel", name: "" }); }
  }, true);

  document.addEventListener("mousedown", (e) => {
    const p = $("panel");
    if (p.classList.contains("hidden")) return;
    if (p.contains(e.target) || e.target.closest("#menu") || e.target.closest("#shield") ||
        e.target.closest("#downloads") || e.target.closest("#musicbtn")) return;
    ipc({ cmd: "panel", name: "" });
  }, true);

  let dragFrom = null;
  const tabbar = $("tabbar");
  if (tabbar) {
    tabbar.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest(".tab, button, input, select, textarea, a")) return;
      dragFrom = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener("pointermove", (e) => {
      if (!dragFrom) return;
      if (Math.abs(e.clientX - dragFrom.x) + Math.abs(e.clientY - dragFrom.y) > 3) {
        dragFrom = null;
        ipc({ cmd: "windowDrag" });
      }
    });
    window.addEventListener("pointerup", () => { dragFrom = null; });
    tabbar.addEventListener("dblclick", (e) => {
      if (e.target.closest(".tab, button, input, select, textarea, a")) return;
      ipc({ cmd: "windowMax" });
    });
  }

  function currentId() { const t = st.tabs.find((x) => x.active); return t ? t.id : 0; }

  render({

    siteBlocked: 0, topBlocked: [],

    lastFreed: 0, suggestDiscard: false,
    cleanSize: 0, cleanScanning: false, usage: [], usageScanning: false, lastClean: 0,
    cleanHistory: false, cleanCache: true, cleanCookies: false, autoClean: false, autoCleanDays: 7,
    qrUrl: "", qrSvg: "",

    bkBookmarks: true, bkSettings: true, bkHistory: true, bkSession: true, bkSpaces: true, bkSets: true, bkReplace: false,
    accent: "#4fd1ff", accent2: "#8b7cff", tabShape: "rounded", uiRadius: 10, uiFont: "segoe",
    uiOpacity: 100, uiBlur: 0, wallpaper: "none", toolbarHidden: false, panelLeft: false,
    addressRow: false, themes: [], themeJson: "",

    vault: null, vaultExists: false, vaultError: "", vaultOrigin: "",
