[package]
name = "orvyn"
version = "3.0.3"
edition = "2021"

[[bin]]
name = "orvyn"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rfd = "0.15"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
ureq = "2.12"
png = "0.17"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.43.0", features = ["bundled"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true


